<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通用回退代理状态</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <h1>回退代理监控</h1>
          <div id="policy-hint"></div>
        </div>
        <div id="toolbar">
          <span id="last-update"></span>
          <button id="refresh-btn">刷新</button>
        </div>
      </header>

      <section id="virtual-models">
        <!-- 动态渲染 -->
      </section>
    </div>

    <!-- 插件页跑在 iframe 里，alert() 会被沙箱拦截，因此自己实现模态框 -->
    <div id="modal" class="modal" hidden>
      <div class="modal-panel">
        <p id="modal-message"></p>
        <button id="modal-ok">确定</button>
      </div>
    </div>

    <!-- 单 Provider 调用日志 -->
    <div id="log-modal" class="modal" hidden>
      <div class="modal-panel log-panel">
        <div class="log-header">
          <span id="log-title">调用日志</span>
          <button id="log-close" class="btn-outline">关闭</button>
        </div>
        <div id="log-list" class="log-list"></div>
      </div>
    </div>

    <!-- 单 Provider 自定义规则：错误信息连续命中指定次数时触发冷却/禁用 -->
    <div id="rules-modal" class="modal" hidden>
      <div class="modal-panel rules-panel">
        <div class="log-header">
          <span id="rules-title">自定义规则</span>
          <span id="rules-dirty" class="rules-dirty" hidden>未保存</span>
          <button id="rules-close" class="btn-outline">关闭</button>
        </div>
        <p class="rules-hint">
          失败原因包含匹配内容（不区分大小写）即记一次命中，连续命中达到阈值时触发对应动作；
          一次成功会清零计数。修改后需点「保存」生效。
        </p>
        <div id="rules-list" class="rules-list"></div>
        <form id="rule-form" class="rule-form">
          <input id="rule-pattern" type="text" placeholder="匹配内容，如 429" maxlength="100" />
          <input id="rule-threshold" type="number" min="1" step="1" placeholder="次数" />
          <select id="rule-action">
            <option value="cooldown">冷却</option>
            <option value="until_midnight">冷却到第二天</option>
            <option value="disable">禁用</option>
          </select>
          <input id="rule-minutes" type="number" min="0.1" step="0.1" placeholder="分钟" />
          <button id="rule-add-btn" type="submit" class="btn-outline">添加</button>
        </form>
        <div class="rules-footer">
          <button id="rules-save-btn" type="button" class="btn-primary">保存</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
