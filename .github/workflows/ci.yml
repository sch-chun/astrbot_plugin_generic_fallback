name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上连续推送时取消掉旧的流水线，省 CI 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # AstrBot 要求 Python >= 3.12，这里覆盖 3.12 与当前次新版
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        # 插件测试需要导入 astrbot.*，直接装 PyPI 上的发行包（比拉整个源码仓库轻）
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install "astrbot>=4.28,<5"

      - name: 运行 pytest
        run: pytest -q

  lint:
    name: 静态检查 / ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 ruff
        run: pip install ruff

      - name: 检查 Python 源码
        # --isolated + 显式规则集：不依赖任何本地 config，本地与 CI 结果一致
        # 这里只用 ruff 默认的 E4/E7/E9/F（语法错误、未定义名字等硬问题），
        # 不启用风格类规则，避免把历史代码的风格问题算成 CI 失败
        run: ruff check --isolated --select E4,E7,E9,F .

  frontend:
    name: 面板前端语法
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 检查 app.js 语法
        run: node --check pages/monitor/app.js
